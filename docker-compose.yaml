# Server deploy (DEV/prod VM behind host nginx-proxy for SSL)
# Env: prod_server.env (see prod_server.env.example)

services:
  postgres:
    image: postgres:16-alpine
    container_name: gilmoreplace-postgres
    restart: unless-stopped
    env_file:
      - ./prod_server.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/db/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./deploy/db:/deploy-db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-django} -d $${POSTGRES_DB:-gilmoreplace_2022}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gilmoreplace

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gilmoreplace-backend
    restart: unless-stopped
    env_file:
      - ./prod_server.env
    environment:
      - DJANGO_SETTINGS_MODULE=gilmoreplace_2022.settings.production
      - DB_HOST=${DB_HOST:-postgres}
      # Set RUN_MIGRATIONS=0 on extra backend replicas; advisory lock still serializes when =1.
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./media_files:/app/media_files
      - ./static:/app/static
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - gilmoreplace

  # Wagtail scheduled publish/unpublish (go_live_at / expire_at); no Celery.
  backend-cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gilmoreplace-backend-cron
    restart: unless-stopped
    env_file:
      - ./prod_server.env
    environment:
      - DJANGO_SETTINGS_MODULE=gilmoreplace_2022.settings.production
      - DB_HOST=${DB_HOST:-postgres}
      - RUN_MIGRATIONS=0
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/deploy/cron/run-scheduled.sh"]
    networks:
      - gilmoreplace

  frontend:
    build:
      context: ./gilmoreplace-next
      dockerfile: Dockerfile
      args:
        WAGTAIL_API_URL: http://backend:8000/api/v2
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://gilmoreplace.ebaluk.store}
    container_name: gilmoreplace-frontend
    restart: unless-stopped
    env_file:
      - ./prod_server.env
    environment:
      - WAGTAIL_API_URL=http://backend:8000/api/v2
    networks:
      - gilmoreplace

  nginx:
    image: nginx:alpine
    container_name: gilmoreplace-nginx
    restart: unless-stopped
    env_file:
      - ./prod_server.env
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-${VIRTUAL_HOST}}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    expose:
      - "80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      - ./media_files:/app/media_files:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gilmoreplace
      - nginx-proxy-network

networks:
  gilmoreplace:
    driver: bridge
  nginx-proxy-network:
    external: true
    name: nginx-proxy-network

volumes:
  postgres_data:
